<meta charset="utf-8">
<title>Граф метро</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: one-screen tool. Left column = who rides + conditions + ranked meeting places; right = geographic metro map. Stacks on phones. */
:root {
  --bg: #e9ecf1; --panel: #ffffff; --map: #f4f6f9; --ink: #131820; --muted: #5a6474;
  --rule: #d6dbe3; --chip: #edf0f4; --accent: #e3002c; --on-accent: #ffffff; --ok: #1a7f4b;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1014; --panel: #161a20; --map: #101318; --ink: #e8ecf2; --muted: #96a1b2;
  --rule: #2a313b; --chip: #212730; --accent: #ff4a5f; --on-accent: #14060a; --ok: #4fd08b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1014; --panel: #161a20; --map: #101318; --ink: #e8ecf2; --muted: #96a1b2;
  --rule: #2a313b; --chip: #212730; --accent: #ff4a5f; --on-accent: #14060a; --ok: #4fd08b; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--rule); overflow-y: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.mapwrap { position: relative; background: var(--map); min-width: 0; min-height: 0; overflow: hidden; }
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .mapwrap { height: 58vh; min-height: 320px; order: -1; border-bottom: 1px solid var(--rule); }
  .side { border-right: 0; overflow: visible; padding: 16px 16px 28px; }
}

.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
h1 .m { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 13px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }

section { display: flex; flex-direction: column; gap: 10px; }
h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }

.person { display: grid; grid-template-columns: 28px 1fr 28px; gap: 8px; align-items: center; position: relative; }
.letter { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.person input { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
.person input.unset { border-style: dashed; }
.x { width: 28px; height: 28px; border: 0; background: none; color: var(--muted); border-radius: 6px; font-size: 18px; line-height: 1; }
.x:hover { background: var(--chip); color: var(--ink); }
.x:disabled { visibility: hidden; }
.dd { position: absolute; left: 36px; right: 36px; top: calc(100% + 4px); z-index: 20; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); padding: 4px; max-height: 280px; overflow-y: auto; }
.dd button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 7px; }
.dd button.hi, .dd button:hover { background: var(--chip); }
.dd .none { padding: 8px; color: var(--muted); }
.add { align-self: flex-start; border: 1px dashed var(--rule); background: none; border-radius: 8px; padding: 6px 12px; color: var(--muted); font-weight: 500; }
.add:hover { color: var(--ink); border-color: var(--muted); }

.badges { display: inline-flex; gap: 3px; flex-wrap: wrap; flex-shrink: 0; }
.b { display: inline-block; min-width: 18px; padding: 0 5px; height: 18px; line-height: 18px; border-radius: 9px; font-size: 10.5px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

.opt { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row label { color: var(--ink); }
.row output { font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); max-width: 60%; }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check input { accent-color: var(--accent); margin-top: 2px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }

.results { display: flex; flex-direction: column; gap: 4px; list-style: none; margin: 0; padding: 0; }
.res { border: 1px solid transparent; border-radius: 10px; }
.res.sel { border-color: var(--rule); background: var(--chip); }
.res > button { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 10px; }
.res:not(.sel) > button:hover { background: var(--chip); }
.rank { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; }
.res.sel .rank { background: var(--accent); color: var(--on-accent); }
.res .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.res .tm { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.res .tm b { color: var(--ink); font-weight: 600; }
.spread { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.spread b { display: block; font-size: 14px; color: var(--ink); }
.spread.even b { color: var(--ok); }
.routes { padding: 2px 12px 12px 44px; display: flex; flex-direction: column; gap: 10px; }
.route .who { font-weight: 600; margin-bottom: 3px; }
.route ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.route li { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; }
.route li .t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.route li.walk { color: var(--muted); }
.more { align-self: flex-start; border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 4px 10px; }
.warn { background: var(--chip); border-radius: 10px; padding: 10px 12px; margin: 0; }
.foot { color: var(--muted); font-size: 12px; margin: 0; }

svg#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg#map.drag { cursor: grabbing; }
#edges line { vector-effect: non-scaling-stroke; stroke-width: 3; stroke-linecap: round; fill: none; }
#edges line.tr { stroke: var(--muted); stroke-width: 1.5; opacity: .6; }
#edges line.off { opacity: .12; }
svg.focus #edges line { opacity: .22; }
svg.focus #edges line.off { opacity: .06; }
#route line { vector-effect: non-scaling-stroke; stroke-linecap: round; fill: none; }
#route .case { stroke: var(--map); stroke-width: 10; }
#route .ride { stroke-width: 6; }
#route .walk { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 2 5; }
#dots circle { stroke: var(--map); stroke-width: 1; }
#dots circle.off { opacity: .15; }
svg.focus #dots circle { opacity: .35; }
#labels text { font-family: var(--font-body); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--map); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
#labels text.strong { font-weight: 700; font-size: 12px; }
#marks text { font-family: var(--font-body); font-weight: 700; font-size: 11px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#marks .cand circle { fill: var(--map); stroke: var(--accent); stroke-width: 2; }
#marks .cand text { fill: var(--accent); }
#marks .cand.sel circle { fill: var(--accent); }
#marks .cand.sel text { fill: var(--on-accent); }
#marks .pin path, #marks .pin circle { fill: var(--ink); stroke: var(--map); stroke-width: 1.5; }
#marks .pin text { fill: var(--panel); font-size: 12px; }
.zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--rule); background: var(--panel); font-size: 17px; line-height: 1; }
.pop { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .2); padding: 10px 12px; width: 220px; display: flex; flex-direction: column; gap: 8px; }
.pop .nm { font-weight: 600; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pop .tm { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pop .btns { display: flex; flex-wrap: wrap; gap: 5px; }
.pop .btns button { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 4px 9px; font-weight: 500; }
.pop .btns button:hover { background: var(--chip); }
.maphint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; background: var(--map); padding: 2px 6px; border-radius: 6px; }
</style>

<div class="app">
  <aside class="side">
    <div class="head">
      <h1><span class="m">М</span>Граф метро</h1>
      <div class="seg" role="group" aria-label="Город">
        <button type="button" id="city-msk" data-city="msk">Москва</button>
        <button type="button" id="city-spb" data-city="spb">Петербург</button>
      </div>
    </div>

    <section>
      <h2>Кто откуда едет</h2>
      <div id="people" style="display:flex;flex-direction:column;gap:8px"></div>
      <button type="button" class="add" id="add">+ Добавить человека</button>
    </section>

    <section>
      <h2>Условия</h2>
      <div class="opt">
        <div>
          <div class="row"><label for="tol">Разница во времени между нами</label><output id="tolOut" for="tol"></output></div>
          <input type="range" id="tol" min="0" max="20" step="1">
        </div>
        <div class="row"><label for="mode">Сначала показывать</label>
          <select id="mode">
            <option value="max">где быстрее всем</option>
            <option value="sum">где меньше ехать в сумме</option>
            <option value="spread">где время ровнее</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="wait"><span>Учитывать ожидание поезда</span></label>
        <label class="check" id="mcdRow"><input type="checkbox" id="nomcd"><span>Не ездить на МЦД</span></label>
      </div>
    </section>

    <section>
      <h2>Где встретиться</h2>
      <div id="out" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>

    <p class="foot" id="foot"></p>
  </aside>

  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="Карта метро">
      <g id="world"><g id="edges"></g><g id="route"></g></g>
      <g id="dots"></g><g id="labels"></g><g id="marks"></g>
    </svg>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Приблизить">+</button>
      <button type="button" id="zout" aria-label="Отдалить">−</button>
      <button type="button" id="zfit" aria-label="Показать всё" title="Показать всё">⤢</button>
    </div>
    <div class="maphint">Нажмите на станцию, чтобы назначить её человеку</div>
  </div>
</div>

function buildGraph(c) {
  const d = DATA[c], n = d.nodes.length, L = d.links;
  const uf = Array.from({ length: n }, (_, i) => i);
  const find = x => { while (uf[x] !== x) { uf[x] = uf[uf[x]]; x = uf[x]; } return x; };
  const out = Array.from({ length: n }, () => []);
  for (let i = 0; i < L.length; i += 4) { out[L[i]].push([L[i + 1], L[i + 2], L[i + 3]]); if (L[i + 3]) uf[find(L[i])] = find(L[i + 1]); }
  const firstOf = {};
  d.nodes.forEach(([s], i) => { if (s in firstOf) uf[find(i)] = find(firstOf[s]); else firstOf[s] = i; });
  let lat0 = 0; d.stations.forEach(s => lat0 += s[2]); lat0 /= d.stations.length;
  const cos = Math.cos(lat0 * Math.PI / 180);
  const xy = d.nodes.map(([s]) => [d.stations[s][1] * cos * 1000, -d.stations[s][2] * 1000]);
  const places = [], byKey = {}, placeOf = new Array(n);
  d.nodes.forEach(([s, l], i) => {
    const key = find(i) + '|' + d.stations[s][0];
    let p = byKey[key];
    if (!p) { p = byKey[key] = { id: places.length, name: d.stations[s][0], nodes: [], lines: [] }; places.push(p); }
    p.nodes.push(i); placeOf[i] = p.id;
    if (!p.lines.some(q => d.lines[q][1] === d.lines[l][1])) p.lines.push(l);
  });
  places.forEach(p => {
    p.x = p.nodes.reduce((a, i) => a + xy[i][0], 0) / p.nodes.length;
    p.y = p.nodes.reduce((a, i) => a + xy[i][1], 0) / p.nodes.length;
    p.key = norm(p.name);
    p.lines.sort((a, b) => a - b);
  });
  const isMcd = d.lines.map(l => /^D/.test(l[1]));
  return { d, n, out, xy, places, placeOf, isMcd, hasMcd: isMcd.some(Boolean) };
}

// Dijkstra over (node, on-train?) states: boarding a train after walking costs half the line's interval.
function dijkstra(starts) {
  const n = G.n, N = 2 * n, dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1), done = new Uint8Array(N);
  for (const s of starts) if (enabled(s)) dist[2 * s] = 0;
  for (;;) {
    let u = -1, best = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0) break;
    done[u] = 1;
    const node = u >> 1, on = u & 1;
    for (const [v, w, tr] of G.out[node]) {
      if (!enabled(v)) continue;
      const nu = tr ? 2 * v : 2 * v + 1;
      const nc = best + w + (!tr && !on && state.wait ? lineOf(node)[3] / 2 : 0);
      if (nc < dist[nu]) { dist[nu] = nc; prev[nu] = u; }
    }
  }
  const arr = new Float64Array(n);
  for (let i = 0; i < n; i++) arr[i] = Math.min(dist[2 * i], dist[2 * i + 1]);
  return { dist, prev, arr };
}

function pathTo(dj, node) {
  let u = dj.dist[2 * node] <= dj.dist[2 * node + 1] ? 2 * node : 2 * node + 1;
  const steps = [];
  while (dj.prev[u] >= 0) { const p = dj.prev[u]; steps.push({ a: p >> 1, b: u >> 1, ride: (u & 1) === 1, sec: dj.dist[u] - dj.dist[p] }); u = p; }
  steps.reverse();
  const segs = [];
  for (const s of steps) {
    const last = segs[segs.length - 1];
    if (s.ride && last && last.ride && last.line === G.d.nodes[s.a][1]) { last.b = s.b; last.sec += s.sec; last.stops++; last.steps.push(s); }
    else segs.push({ ride: s.ride, line: G.d.nodes[s.ride ? s.a : s.b][1], a: s.a, b: s.b, sec: s.sec, stops: 1, steps: [s] });
  }
  return segs;
}

function compute() {
  const people = state.people[state.city];
  results = []; fallback = false; dists = [];
  const set = people.map(p => p.place != null ? G.places[p.place] : null);
  dists = set.map(p => p ? dijkstra(p.nodes) : null);
  if (set.some(p => !p) || set.length < 2) return;
  const all = [];
  for (const p of G.places) {
    let best = null;
    for (const v of p.nodes) {
      if (!enabled(v)) continue;
      const t = dists.map(d => d.arr[v]);
      if (t.some(x => !isFinite(x))) continue;
      const max = Math.max(...t), min = Math.min(...t), sum = t.reduce((a, b) => a + b, 0);
      const r = { place: p, node: v, t, max, min, sum, spread: max - min };
      if (!best || key(r) < key(best)) best = r;
    }
    if (best) all.push(best);
  }
  function key(r) { return state.mode === 'sum' ? r.sum * 1e5 + r.max : state.mode === 'spread' ? Math.max(r.spread, 0) * 1e5 + r.max : r.max * 1e5 + r.sum; }

  let ok = all.filter(r => r.spread <= tol);
  if (!ok.length) { fallback = true; const bm = Math.min(...all.map(r => r.max)); ok = all.filter(r => r.max <= bm + 900).sort((a, b) => a.spread - b.spread || a.max - b.max).slice(0, 5); }
  else {
    if (state.mode === 'spread') { const bm = Math.min(...ok.map(r => r.max)); ok = ok.filter(r => r.max <= bm + 600); }
    ok.sort((a, b) => key(a) - key(b));
  }
  results = ok.slice(0, 30);
  if (state.sel >= results.length) state.sel = 0;
}

  let html = '';
  if (fallback) html += `<p class="warn">Нет станций, где разница во времени укладывается в ${state.tol} мин. Вот самые ровные варианты — или увеличьте допустимую разницу.</p>`;
  html += '<ol class="results">' + shown.map((r, j) => `
    <li class="res ${j === state.sel ? 'sel' : ''}">
      <button type="button" data-j="${j}" aria-expanded="${j === state.sel}">
        <span class="rank">${j + 1}</span>
        <span style="min-width:0"><span class="nm">${esc(r.place.name)} ${badges(r.place)}</span>
          <span class="tm">${r.t.map((t, i) => `<span>${LETTERS[i]} <b>${mins(t)}</b> мин</span>`).join('')}</span></span>
        <span class="spread ${mins(r.spread) <= 2 ? 'even' : ''}"><b>${mins(r.spread)} мин</b>разница</span>
      </button>
      ${j === state.sel ? `<div class="routes">${routeHtml(r)}</div>` : ''}
    </li>`).join('') + '</ol>';
  if (!state.showAll && results.length > shown.length) html += `<button type="button" class="more" id="more">Показать ещё ${results.length - shown.length}</button>`;
  out.innerHTML = html;
}
$('#out').addEventListener('click', e => {
  if (e.target.id === 'more') { state.showAll = true; renderResults(); renderMap(true); return; }
  const b = e.target.closest('.res > button'); if (!b) return;
  state.sel = +b.dataset.j; renderResults(); renderMap(true);
});

/* ---------- map ---------- */
const svg = $('#map'), wrap = $('#mapwrap');
let dotEls = [], labelEls = [];
function buildMap() {
  const edges = $('#edges'), seen = new Set(), L = G.d.links;
  edges.textContent = ''; $('#dots').textContent = ''; $('#labels').textContent = '';
  const tr = [], ride = [];
  for (let i = 0; i < L.length; i += 4) {
    const a = L[i], b = L[i + 1], k = Math.min(a, b) + '-' + Math.max(a, b);
    if (seen.has(k)) continue; seen.add(k);
    const ln = el('line', { x1: G.xy[a][0], y1: G.xy[a][1], x2: G.xy[b][0], y2: G.xy[b][1] });
    ln._n = [a, b];
    if (L[i + 3]) { ln.setAttribute('class', 'tr'); tr.push(ln); } else { ln.setAttribute('stroke', lineOf(a)[2]); ride.push(ln); }
  }
  edges.append(...tr, ...ride);
  dotEls = G.d.nodes.map((nd, i) => { const c = el('circle', { fill: G.d.lines[nd[1]][2] }); $('#dots').appendChild(c); return c; });
  labelEls = G.places.map(p => { const t = el('text', {}); t.textContent = p.name; $('#labels').appendChild(t); return t; });
}
function applyDisabled() {
  for (const ln of $('#edges').children) ln.classList.toggle('off', !enabled(ln._n[0]) || !enabled(ln._n[1]));
  dotEls.forEach((c, i) => c.classList.toggle('off', !enabled(i)));
}
function fit(nodes) {
  const r = wrap.getBoundingClientRect(); if (!r.width) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const i of nodes) { const [x, y] = G.xy[i]; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const k = Math.min(r.width / (x1 - x0 + 1), r.height / (y1 - y0 + 1)) * 0.88;
  view = { k, tx: r.width / 2 - (x0 + x1) / 2 * k, ty: r.height / 2 - (y0 + y1) / 2 * k };
}
const fitDefault = () => fit(G.d.nodes.map((_, i) => i).filter(i => !G.isMcd[G.d.nodes[i][1]]));
const sx = x => x * view.k + view.tx, sy = y => y * view.k + view.ty;

function renderMap(rebuildRoute) {
  const r = wrap.getBoundingClientRect(), W = r.width, H = r.height;
  $('#world').setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  const rad = Math.max(2.2, Math.min(5.5, 1.4 + view.k * 0.45));
  dotEls.forEach((c, i) => { c.setAttribute('cx', sx(G.xy[i][0])); c.setAttribute('cy', sy(G.xy[i][1])); c.setAttribute('r', rad); });
  const people = state.people[state.city], sel = results[state.sel];
  svg.classList.toggle('focus', !!sel);

  if (rebuildRoute) {
    const g = $('#route'); g.textContent = '';
    if (sel) {
      const cas = [], top = [];
      sel.t.forEach((_, i) => pathTo(dists[i], sel.node).forEach(s => s.steps.forEach(st => {
        const a = { x1: G.xy[st.a][0], y1: G.xy[st.a][1], x2: G.xy[st.b][0], y2: G.xy[st.b][1] };
        if (st.ride) { cas.push(el('line', { ...a, class: 'case' })); top.push(el('line', { ...a, class: 'ride', stroke: lineOf(st.a)[2] })); }
        else top.push(el('line', { ...a, class: 'walk' }));
      })));
      g.append(...cas, ...top);
    }
  }

  // markers
  const marks = $('#marks'); marks.textContent = '';
  const shown = state.showAll ? results : results.slice(0, 8);
  const strong = new Map();
  shown.forEach((res, j) => {
    if (j === state.sel) return;
    const g = el('g', { class: 'cand', transform: `translate(${sx(G.xy[res.node][0])} ${sy(G.xy[res.node][1])})` });
    g.append(el('circle', { r: 9 })); const t = el('text', {}); t.textContent = j + 1; g.append(t); marks.append(g);
    strong.set(res.place.id, 2);
  });
  if (sel) {
    const g = el('g', { class: 'cand sel', transform: `translate(${sx(G.xy[sel.node][0])} ${sy(G.xy[sel.node][1])})` });
    g.append(el('circle', { r: 12 })); const t = el('text', {}); t.textContent = state.sel + 1; g.append(t); marks.append(g);
    strong.set(sel.place.id, 4);
  }
  people.forEach((p, i) => {
    if (p.place == null) return;
    const pl = G.places[p.place];
    const g = el('g', { class: 'pin', transform: `translate(${sx(pl.x)} ${sy(pl.y)})` });
    g.append(el('path', { d: 'M0 0 L-6 -12 A11 11 0 1 1 6 -12 Z' }));
    const t = el('text', { y: -20 }); t.textContent = LETTERS[i]; g.append(t); marks.append(g);
    strong.set(pl.id, 3);
  });

  // labels with greedy collision culling
  const order = G.places.map(p => p.id).sort((a, b) => (strong.get(b) || 0) - (strong.get(a) || 0) || G.places[b].nodes.length - G.places[a].nodes.length);
  const boxes = [];
  for (const id of order) {
    const p = G.places[id], t = labelEls[id], s = strong.get(id) || 0;
    const x = sx(p.x) + (s ? 15 : rad + 5), y = sy(p.y) + 4, w = p.name.length * (s ? 7.2 : 6.3) + 6;
    let ok = x < W && x + w > 0 && y > 0 && y < H + 12 && (s || p.nodes.some(enabled));
    if (ok && !s && view.k < 2.2 && p.nodes.length < 2) ok = false;
    const bx = [x - 2, y - 12, x + w, y + 4];
    if (ok && s < 3) for (const o of boxes) if (bx[0] < o[2] && bx[2] > o[0] && bx[1] < o[3] && bx[3] > o[1]) { ok = false; break; }
    if (ok) { boxes.push(bx); t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('class', s ? 'strong' : ''); t.removeAttribute('display'); }
    else t.setAttribute('display', 'none');
  }
}

/* pan / zoom / click */
const ptrs = new Map(); let moved = 0, pinch = 0, touched = false;
function zoomAt(f, cx, cy) {
  const k = Math.max(0.3, Math.min(400, view.k * f)); f = k / view.k;
  view = { k, tx: cx - (cx - view.tx) * f, ty: cy - (cy - view.ty) * f }; touched = true; closePop(); renderMap();
}
svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0018), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 1) moved = 0; pinch = 0; });
svg.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1];
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) { svg.classList.add('drag'); touched = true; view.tx += dx; view.ty += dy; closePop(); renderMap(); }
  } else if (ptrs.size === 2) {
    moved = 99; const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = svg.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    pinch = d;
  }
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); svg.classList.remove('drag'); pinch = 0;
  if (e.type === 'pointerup' && moved <= 4 && ptrs.size === 0) { const r = svg.getBoundingClientRect(); clickAt(e.clientX - r.left, e.clientY - r.top); }
};
svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
$('#zin').addEventListener('click', () => { const r = wrap.getBoundingClientRect(); zoomAt(1.5, r.width / 2, r.height / 2); });
$('#zout').addEventListener('click', () => { const r = wrap.getBoundingClientRect(); zoomAt(1 / 1.5, r.width / 2, r.height / 2); });
$('#zfit').addEventListener('click', () => { touched = false; fitDefault(); closePop(); renderMap(); });

let pop = null;
function closePop() { if (pop) { pop.remove(); pop = null; } }
function clickAt(x, y) {
  closePop();
  let best = null, bd = 18 * 18;
  for (const p of G.places) { const d = (sx(p.x) - x) ** 2 + (sy(p.y) - y) ** 2; if (d < bd) { bd = d; best = p; } }
  if (!best) return;
  const people = state.people[state.city], r = wrap.getBoundingClientRect();
  const times = people.map((_, i) => { if (!dists[i]) return null; const t = Math.min(...best.nodes.map(v => dists[i].arr[v])); return isFinite(t) ? `${LETTERS[i]} ${mins(t)} мин` : null; }).filter(Boolean);
  pop = document.createElement('div'); pop.className = 'pop';
  pop.innerHTML = `<div class="nm">${esc(best.name)} ${badges(best)}</div>
    ${times.length ? `<div class="tm">Ехать сюда: ${times.join(' · ')}</div>` : ''}
    <div class="btns">${people.map((_, i) => `<button type="button" data-i="${i}">Отсюда едет ${LETTERS[i]}</button>`).join('')}</div>`;
  pop.style.left = Math.max(8, Math.min(r.width - 228, sx(best.x) + 12)) + 'px';
  pop.style.top = Math.max(8, Math.min(r.height - 130, sy(best.y) + 12)) + 'px';
  pop.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPlace(+b.dataset.i, best.id); });
  wrap.appendChild(pop);
}

/* ---------- wiring ---------- */
function save() { try { localStorage.setItem('metro-graph', JSON.stringify({ city: state.city, tol: state.tol, mode: state.mode, wait: state.wait, nomcd: state.nomcd,
  people: Object.fromEntries(Object.entries(state.people).map(([c, pp]) => [c, pp.map(p => p.place == null ? null : graphs[c].places[p.place].nodes[0])])) })); } catch (e) {} }
function update() { compute(); renderResults(); renderMap(true); save(); }
function setCity(c, keepView) {
  state.city = c; G = graphs[c]; state.sel = 0; state.showAll = false; closePop(); closeDD();
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.dataset.city === c);
  $('#mcdRow').hidden = !G.hasMcd;
  $('#foot').textContent = `Время перегонов и переходов взято из схемы Яндекс Метро (${G.d.name}, версия ${G.d.version}). Ожидание поезда считается как половина интервала линии. Станции: ${G.d.stations.length}.`;
  buildMap(); applyDisabled(); renderPeople(); touched = false; fitDefault(); update();
}
document.querySelector('.seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.city !== state.city) setCity(b.dataset.city); });
const syncTol = () => { $('#tolOut').textContent = state.tol ? `до ${state.tol} мин` : 'одинаково'; };
$('#tol').addEventListener('input', e => { state.tol = +e.target.value; state.sel = 0; syncTol(); update(); });
$('#mode').addEventListener('change', e => { state.mode = e.target.value; state.sel = 0; update(); });
$('#wait').addEventListener('change', e => { state.wait = e.target.checked; update(); });
$('#nomcd').addEventListener('change', e => { state.nomcd = e.target.checked; state.sel = 0; applyDisabled(); update(); });
document.addEventListener('pointerdown', e => { if (pop && !pop.contains(e.target) && e.target.closest('.side')) closePop(); });

for (const c in DATA) graphs[c] = buildGraph(c);
let saved = null; try { saved = JSON.parse(localStorage.getItem('metro-graph')); } catch (e) {}
for (const c in DATA) {
  const g = graphs[c], sp = saved && saved.people && saved.people[c];
  state.people[c] = sp && sp.length >= 2 ? sp.slice(0, 6).map(n => ({ place: n != null && g.placeOf[n] != null ? g.placeOf[n] : null }))
    : DEFAULTS[c].map(nm => { const p = g.places.find(p => p.name === nm); return { place: p ? p.id : null }; });
}
if (saved) { if (DATA[saved.city]) state.city = saved.city; if (saved.tol >= 0 && saved.tol <= 20) state.tol = saved.tol; if (['max', 'sum', 'spread'].includes(saved.mode)) state.mode = saved.mode; state.wait = saved.wait !== false; state.nomcd = !!saved.nomcd; }
$('#tol').value = state.tol; $('#mode').value = state.mode; $('#wait').checked = state.wait; $('#nomcd').checked = state.nomcd; syncTol();
setCity(state.city);
new ResizeObserver(() => { if (!touched) fitDefault(); renderMap(); }).observe(wrap);
</script>
